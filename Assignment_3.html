<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>

    <style>
        body
        {
            font-family: Arial;
            text-align: center;
        }

        input
        {
            margin: 5px;
            padding: 5px;
        }

        button
        {
            margin: 10px;
            padding: 5px 10px;
        }

        table
        {
            margin: auto;
            border-collapse: collapse;
        }

        table, th, td
        {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>

<body>

    <h2>Student Result Calculator</h2>

    <input type="text" id="studentName" placeholder="Enter Student Name"><br>

    <input type="number" id="physics" placeholder="Physics Marks"><br>

    <input type="number" id="chemistry" placeholder="Chemistry Marks"><br>

    <input type="number" id="maths" placeholder="Maths Marks"><br>

    <button onclick="showResult()">Submit</button>

    <br><br>

    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Physics</th>
            <th>Chemistry</th>
            <th>Maths</th>
            <th>Total</th>
            <th>Percentage</th>
        </tr>
    </table>

    <script src="script.js"></script>

</body>
</html>
